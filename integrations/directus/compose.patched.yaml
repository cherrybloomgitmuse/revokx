name: revokx-directus-1150
services:
  directus:
    image: directus/directus@sha256:23f2f526599bff1746121fd7e4e1101744661c7ce35d90370a738bc5c48bea3e
    environment:
      SECRET: "${DIRECTUS_SECRET:?Local .env is required}"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "${DIRECTUS_ADMIN_PASSWORD:?Local .env is required}"
      DB_CLIENT: "sqlite3"
      DB_FILENAME: "/directus/database/data.db"
      PUBLIC_URL: "http://127.0.0.1:8055"
      TELEMETRY: "false"
    volumes:
      - database:/directus/database
      - uploads:/directus/uploads
    networks:
      - lab
    restart: "no"
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8055:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - directus
    networks:
      - lab
      - access
    restart: "no"
volumes:
  database:
  uploads:
networks:
  lab:
    internal: true
  access:
    driver: bridge